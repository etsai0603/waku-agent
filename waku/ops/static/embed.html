<!doctype html><html@@THEME@@><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waku chat</title>
<link rel="icon" type="image/svg+xml" href="/static/waku-mark.svg">
<link rel="stylesheet" href="/static/design/fonts.css">
<link rel="stylesheet" href="/static/design/tokens.css">
<link rel="stylesheet" href="/static/design/type.css">
<link rel="stylesheet" href="/static/design/controls.css">
<link rel="stylesheet" href="/static/style.css"></head>
<!-- The dashboard's chat column alone, for waku.one to frame (spec 008).
     Served by dashboard.py at /embed/chat, which fills in data-embed-origins:
     the only origins this page will ever postMessage to (js/embed.js), and
     the html tag's theme: data-theme="light|dark" when the address
     carried ?theme=, so the first paint is the console's (spec 040 T). The
     markup is index.html's #dock with the parts that need the rest of the
     dashboard left out: no collapse button, no local-Whisper mic (#mic), and
     no inline script, so the page runs only the files below. Voice here is
     the browser's own speech recognition (#dvoice), shown only where the
     browser has it. -->
<body class="embed" data-embed-origins="@@EMBED_ORIGINS@@">
<aside id="dock">
  <!-- The model picker sits on its own row, first, right under waku.one's
       "Waku Agent" title, so the person reads which model answers before
       anything else (design owner, 2026-10-07). -->
  <div class="embed-model"><button class="modelchip" id="modelchip" onclick="toggleModelMenu(event)" title="Switch the model for this chat">&hellip;</button></div>
  <div class="sesshead">
    <button class="btn btn-secondary btn-sm sessbtn" onclick="newChat()">+ New chat</button>
    <button class="btn btn-secondary btn-sm sessbtn" onclick="toggleSessMenu(event)">History &#9662;</button>
    <button class="btn btn-secondary btn-sm sessbtn teletoggle" id="teletoggle" onclick="toggleTele()" title="Show/hide per-turn stats: gate decision, seconds, iterations, tools">stats</button>
    <button class="btn btn-secondary btn-sm sessbtn" id="opendash" onclick="openDashboard()" title="Open the full dashboard in a new tab, signed in">Dashboard</button>
  </div>
  <div class="chatlog" id="docklog"></div>
  <div class="chatbar">
    <textarea id="dmsg" rows="1" placeholder="Message Waku&hellip;" autocomplete="off"></textarea>
    <div class="chatbar-actions">
      <button id="dvoice" class="btn btn-secondary" aria-label="Speak" title="Speak" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button id="dsend" class="btn btn-primary">Send</button>
    </div>
  </div>
  <!-- While the person speaks, the whole chat column turns into a dithered
       ring that grows with their voice (Waku Memory spec 054, the
       ListeningRing). The dot in the middle ends the recording and puts the
       words in the field, unsent. Send under the words sends them at once. -->
  <div id="listen" hidden>
    <canvas id="listen-ring" aria-hidden="true"></canvas>
    <div class="listen-top"><span class="listen-label">Listening</span>
      <button id="listen-cancel" class="btn btn-secondary btn-sm">Cancel</button></div>
    <button id="listen-done" aria-label="Done"></button>
    <div class="listen-words"><div id="listen-words">&hellip;</div>
      <button id="listen-send" class="btn btn-primary btn-sm">Send</button></div>
  </div>
</aside>
<!-- The same classic scripts as the dashboard, minus every view: embed.js
     stands in for main.js and loads last. -->
<script src="/static/js/util.js"></script>
<script src="/static/js/theme.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/blocks.js"></script>
<script src="/static/js/render.js"></script>
<script src="/static/js/dock.js"></script>
<script src="/static/js/embed.js"></script></body></html>
